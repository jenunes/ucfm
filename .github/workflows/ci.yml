name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # publiccheck reads every commit.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Nothing private in files or commits
        run: go run ./tools/publiccheck -commits HEAD

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Not gofmt-ed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Rule reference is up to date
        run: |
          make docs
          git diff --exit-code docs/reference/rules.md

      - name: Relative links and anchors
        run: make linkcheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # .golangci.yml uses the v2 configuration format; action v8 runs
      # golangci-lint v2.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
